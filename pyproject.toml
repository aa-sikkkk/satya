[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satya-learning-system"
version = "2.2.0"
description = "Offline-first RAG learning companion for Grades 8-12 (NEB curriculum), optimized for 4GB-RAM hardware."
readme = "readme.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Satya Project Contributors" }]
keywords = ["education", "rag", "offline", "nepal", "llm", "phi-1-5", "chromadb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: Noncommercial (see LICENSE)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "llama-cpp-python>=0.3.16",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "customtkinter>=5.2.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "openai>=1.0.0",
    "PyMuPDF>=1.23.0",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "psutil>=5.9",
    "requests>=2.31",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "easyocr>=1.7.0", "Pillow>=9.0.0", "opencv-python>=4.8.0"]
nlp = ["spacy>=3.7.0", "language-tool-python>=2.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "memory-profiler>=0.61",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/aa-sikkkk/satya"
Documentation = "https://github.com/aa-sikkkk/satya/docs"

[tool.setuptools.packages.find]
include = ["student_app*", "system*", "ai_model*", "teacher_tools*", "scripts*"]

[tool.black]
line-length = 88
exclude = '(venv|dist|satya_data|plan|\.cursor)/'
extend-exclude = '(venv|dist|satya_data|plan|\.cursor)/'

[tool.isort]
profile = "black"
line_length = 88
py_version = 311
known_first_party = ["student_app", "system", "ai_model", "teacher_tools", "scripts"]
skip_glob = ["venv/*", "dist/*", "satya_data/*", "plan/*", ".cursor/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", "dist", "satya_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package roots are intentional (F401); blind-raises and
# side-effect-only assignments are intentional in legacy tests (B017, F841)
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]
"tests/**" = ["B017", "F841"]
# Deliberate imports after env/sys.path setup in legacy scripts
"scripts/run_pattern_mining.py" = ["E402"]
"student_app/interface/cli_interface.py" = ["E402"]
"system/rag/rag_helper.py" = ["E402"]
"teacher_tools/analytics/analytics_cli.py" = ["E402"]
"teacher_tools/content_editor/content_editor_cli.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["venv", "dist", "satya_data", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --timeout=300"
markers = [
    "requires_model: tests that need downloaded model/binary assets (skipped in CI)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["system"]
omit = [
    "*/__main__.py",
    "*/tests/*",
    # RAG/model pipeline modules exercise real ChromaDB + GGUF binaries; their
    # requires_model tests are deselected in CI, so their lines can't execute.
    # Raise these back in Phase 3 when coverage is measured from a local full run.
    "system/rag/*",
    "system/utils/*",
]

[tool.coverage.report]
# 80% is the standards goal (docs/PROJECT_STANDARDS.md) measured incl. the
# requires_model tests locally; the CI-only bound starts at the measured
# model-free baseline so the gate is honest but bindable (see CHANGELOG).
fail_under = 55
