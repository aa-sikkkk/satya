# Manual tag-driven release pipeline. A release is cut ONLY when the
# maintainer pushes a tag (never automatically after merges). The job
# creates the GitHub Release for the tag and attaches the student
# installable artifacts (wheel, sdist, OFFLINE installer zip).
name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install -U pip build -q
          python -m build --outdir dist

      - name: Build llama-cpp-python wheel (if PyPI ships sdist only)
        # llama-cpp-python publishes source dists for many releases; a
        # compile here (cmake + MSVC already on the runner) guarantees a
        # binary wheel in the offline bundle.
        timeout-minutes: 20
        run: |
          python -m pip install -U cmake ninja -q
          python -m pip wheel "llama-cpp-python>=0.3.16" -w wheels_prebuilt

      - name: Download dependency closure (Windows py3.12 wheels)
        run: |
          New-Item -ItemType Directory -Force -Path wheels | Out-Null
          python -m pip download (Get-ChildItem dist -Filter "satya_learning_system-*.whl").FullName --dest wheels -q

      - name: Assemble OFFLINE student installer zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_offline/wheels | Out-Null
          Copy-Item scripts/release/install_satya.ps1 pkg_offline/
          Copy-Item scripts/release/QUICKSTART.md pkg_offline/
          Copy-Item dist/satya_learning_system-*.whl pkg_offline/
          Copy-Item wheels/* pkg_offline/wheels/
          Copy-Item wheels_prebuilt/* pkg_offline/wheels/
          Compress-Archive -Path pkg_offline/* -DestinationPath "Satya_Student_Offline_Win.zip" -Force

      - name: Assemble small installer-only zip (PyPI fallback path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_small | Out-Null
          Copy-Item scripts/release/install_satya.ps1 pkg_small/
          Copy-Item scripts/release/QUICKSTART.md pkg_small/
          Copy-Item dist/satya_learning_system-*.whl pkg_small/
          Compress-Archive -Path pkg_small/* -DestinationPath "Satya_Student_Installer_Win.zip" -Force

      - name: Create release and attach artifacts (idempotent on rerun)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading/updating assets only"
            gh release upload "$TAG" \
              dist/satya_learning_system-*.whl dist/satya_learning_system-*.tar.gz \
              Satya_Student_Offline_Win.zip Satya_Student_Installer_Win.zip --clobber
          else
            gh release create "$TAG" --generate-notes \
              --title "Satya Learning System $TAG" \
              dist/satya_learning_system-*.whl dist/satya_learning_system-*.tar.gz \
              Satya_Student_Offline_Win.zip Satya_Student_Installer_Win.zip
          fi
