# Manual tag-driven release pipeline. A release is cut ONLY when the
# maintainer pushes a tag (never automatically after merges). The job
# creates the GitHub Release for the tag and attaches the student
# installable artifacts (wheel, sdist, OFFLINE installer zip).
name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install -U pip build -q
          python -m build --outdir dist

      - name: Build llama-cpp-python wheel (if PyPI ships sdist only)
        # llama-cpp-python publishes source dists for many releases; a
        # compile here (cmake + MSVC already on the runner) guarantees a
        # binary wheel in the offline bundle.
        timeout-minutes: 20
        run: |
          python -m pip install -U cmake ninja -q
          python -m pip wheel "llama-cpp-python>=0.3.16" -w wheels_prebuilt

      - name: Download dependency closure (Windows py3.12 wheels)
        run: |
          New-Item -ItemType Directory -Force -Path wheels | Out-Null
          python -m pip download (Get-ChildItem dist -Filter "satya_learning_system-*.whl").FullName --dest wheels -q

      - name: Build offline knowledge base (ChromaDB from tracked content)
        run: |
          python -m pip install "chromadb>=0.4.0" "sentence-transformers>=2.2.0" -q
          python scripts/build_vectordb.py --db kb_build --out-manifest knowledge_base/manifest.json
          New-Item -ItemType Directory -Force -Path knowledge_base/chroma_db | Out-Null
          Copy-Item kb_build/* knowledge_base/chroma_db/ -Recurse
          Compress-Archive -Path knowledge_base -DestinationPath "Satya_Knowledge_Base.zip" -Force

      - name: Attach AI model asset (pinned Q4_K_M GGUF)
        run: |
          New-Item -ItemType Directory -Force -Path model_asset | Out-Null
          $url = "https://huggingface.co/RichardErkhov/microsoft_-_phi-1_5-gguf/resolve/main/phi-1_5.Q4_K_M.gguf"
          $src = "https://huggingface.co/microsoft/phi-1_5"
          $conv = "https://huggingface.co/RichardErkhov/microsoft_-_phi-1_5-gguf"
          curl.exe --fail --silent --show-error --retry 3 --retry-delay 2 -L -o model_asset/phi-1_5.Q4_K_M.gguf $url
          $hash = (Get-FileHash model_asset/phi-1_5.Q4_K_M.gguf -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "457f510790d7b19358f44ccbaf8bf540556471f3c344c99cc3ef8a74274a98fb") {
            Write-Host "[X] Model sha256 mismatch (pinned 457f5107..., got $hash)" -ForegroundColor Red
            exit 1
          }
          if ((Get-Item model_asset/phi-1_5.Q4_K_M.gguf).Length -ne 893546944) {
            Write-Host "[X] Model size mismatch (expected 893546944 bytes)" -ForegroundColor Red
            exit 1
          }
          Set-Content -Path model_asset/MODEL_README.txt -Encoding utf8 -Value "Phi-1.5 GGUF quantification shipped with Satya`r`n`r`nUpstream model (MIT license): $src`r`nGGUF conversion (community mirror): $conv`r`nFile: phi-1_5.Q4_K_M.gguf, $((Get-Item model_asset/phi-1_5.Q4_K_M.gguf).Length) bytes`r`nSHA-256: $hash`r`n`r`nThe MIT License of the upstream Phi-1.5 model applies and is retained per`r`nthat license - full text: https://huggingface.co/microsoft/phi-1_5/blob/main/LICENSE"
          Compress-Archive -Path model_asset/phi-1_5.Q4_K_M.gguf, model_asset/MODEL_README.txt -DestinationPath "Satya_Phi_1_5_Model_Win.zip" -CompressionLevel Fastest

      - name: Assemble OFFLINE student installer zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_offline/wheels | Out-Null
          Copy-Item scripts/release/install_satya.ps1 pkg_offline/
          Copy-Item scripts/release/QUICKSTART.md pkg_offline/
          Copy-Item dist/satya_learning_system-*.whl pkg_offline/
          Copy-Item wheels/* pkg_offline/wheels/
          Copy-Item wheels_prebuilt/* pkg_offline/wheels/
          Copy-Item Satya_Knowledge_Base.zip pkg_offline/
          Compress-Archive -Path pkg_offline/* -DestinationPath "Satya_Student_Offline_Win.zip" -Force

      - name: Assemble small installer-only zip (PyPI fallback path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_small | Out-Null
          Copy-Item scripts/release/install_satya.ps1 pkg_small/
          Copy-Item scripts/release/QUICKSTART.md pkg_small/
          Copy-Item dist/satya_learning_system-*.whl pkg_small/
          Compress-Archive -Path pkg_small/* -DestinationPath "Satya_Student_Installer_Win.zip" -Force

      - name: Create release and attach artifacts (idempotent on rerun)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG exists - uploading/updating assets"
            gh release upload "$TAG" \
              dist/satya_learning_system-*.whl dist/satya_learning_system-*.tar.gz \
              Satya_Student_Offline_Win.zip Satya_Student_Installer_Win.zip \
              Satya_Knowledge_Base.zip Satya_Phi_1_5_Model_Win.zip --clobber
            if gh release view "$TAG" --json isDraft --jq .isDraft | grep -qi true; then
              echo "Draft release - publishing after assets upload"
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" --generate-notes \
              --title "Satya Learning System $TAG" \
              dist/satya_learning_system-*.whl dist/satya_learning_system-*.tar.gz \
              Satya_Student_Offline_Win.zip Satya_Student_Installer_Win.zip \
              Satya_Knowledge_Base.zip Satya_Phi_1_5_Model_Win.zip
          fi
