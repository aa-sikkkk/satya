# release-please — Conventional-Commits driven releases (free action)
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        # RELEASE_PLEASE_TOKEN (optional PAT) makes the release PR also
        # trigger required checks; falls back to the default token.
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
