name: CI

on:
  push:
    branches: [master, develop]
    # push-only skips: PRs must still run required checks even for docs
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: pip install ruff black isort
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Size note: torch + sentence-transformers + chromadb install is slow but
    # cached; tests skip model binaries via the `requires_model` marker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (skip model-dependent)
        env:
          SATYA_SKIP_HEAVY_TESTS: "1"
        # coverage gate lives in pyproject [tool.coverage.report] fail_under
        run: pytest -m "not requires_model" --cov --cov-report=term

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: pip-audit
        run: |
          pip install pip-audit
          # Unfixable upstream advisories (latest releases; fix_versions empty as of 2026-10-22):
          #   chromadb PYSEC-2026-311/3813/3814/3815 — server-side tenancy model and
          #     trust_remote_code loading paths; Satya is an offline, single-student
          #     library consumer (no server, no multi-tenant auth). Tracked in
          #     chroma-core/chroma#7909, re-check on next chromadb release.
          #   diskcache PYSEC-2026-2447 — pickle RCE requires attacker write access
          #     to the on-disk cache directory; cache lives in the local user dir.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-2447
