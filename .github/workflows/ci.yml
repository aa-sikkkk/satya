name: CI

# Triggers:
#   - PRs to master: full gate (this is the merge safety net)
#   - pushes to master: lint + CodeQL + trivial bits only (tests/audit are
#     verified on the PR on the same SHA; no Minutes wasted rerunning them)
#   - weekly scheduled compat run: full gate with py3.11 so dependency drift
#     cannot silently break the project's Python floor between PRs
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master]
  schedule:
    - cron: "14 4 * * 1"

# Pull-request code must never run with a write-capable token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        # pinned to requirements-dev.txt versions so local and CI formatting
        # tools never disagree (black's newer releases reformat differently)
        run: pip install ruff==0.17.1 black==25.9.0 isort==7.0.0
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .

  test:
    name: Tests (py3.12)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Size note: torch + sentence-transformers + chromadb install is slow but
    # cached; tests skip model binaries via the `requires_model` marker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (skip model-dependent)
        env:
          SATYA_SKIP_HEAVY_TESTS: "1"
        # coverage gate lives in pyproject [tool.coverage.report] fail_under
        run: pytest -m "not requires_model" --cov --cov-report=term

  audit:
    name: Dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: pip-audit
        run: |
          pip install pip-audit
          # Unfixable upstream advisories (latest releases; fix_versions empty as of 2026-10-22):
          #   chromadb PYSEC-2026-311/3813/3814/3815 — server-side tenancy model and
          #     trust_remote_code loading paths; Satya is an offline, single-student
          #     library consumer (no server, no multi-tenant auth). Tracked in
          #     chroma-core/chroma#7909, re-check on next chromadb release.
          #   diskcache PYSEC-2026-2447 — pickle RCE requires attacker write access
          #     to the on-disk cache directory; cache lives in the local user dir.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-2447

  # Compat guard: same tests on 3.11 once a week so a dependency bump can't
  # silently break the declared Python floor between PRs.
  test-py311-compat:
    name: Weekly compat (py3.11)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (skip model-dependent)
        env:
          SATYA_SKIP_HEAVY_TESTS: "1"
        run: pytest -m "not requires_model"