# Dependabot version updates — free, GitHub-native
# Groups minor/patch into one PR per ecosystem to avoid review spam
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    # Major-version bumps for these are merged deliberately by the maintainer
    # (they reformat or break the runtime contract), not by automation:
    ignore:
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "isort"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-deps:
        patterns:
          - "actions/*"
    labels:
      - "dependencies"
      - "ci"
